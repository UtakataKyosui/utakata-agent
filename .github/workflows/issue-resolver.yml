name: Issue Auto-Resolver

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    # issue 作成時、または /resolve コメント時のみ実行
    if: |
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/resolve'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: agents/new-idea-agents

      - name: Run Issue Resolver Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: agents/new-idea-agents
        run: |
          ISSUE_URL="${{ github.event.issue.html_url }}"
          # issue_comment イベントの場合は issue_url から URL を組み立てる
          if [ -z "$ISSUE_URL" ]; then
            ISSUE_URL="$(echo '${{ github.event.comment.issue_url }}' | sed 's|api\.github\.com/repos|github.com|; s|/issues/|/issues/|')"
          fi
          bun index.ts issue "$ISSUE_URL" --cwd "${{ github.workspace }}"
